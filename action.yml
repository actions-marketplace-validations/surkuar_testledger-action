name: "TestLedger - Test Estate Balance Sheet"
description: "Price every automated test: CI cost, flakes, maintenance vs. regressions caught. Posts a Quality Investment Memo."
author: "Suresh Babu (surkuar)"
branding:
  icon: "book-open"
  color: "green"

inputs:
  config:
    description: "Path to testledger.yml"
    required: false
    default: "testledger.yml"
  reports:
    description: "Folder containing JUnit XML / TestNG XML / Cucumber JSON reports"
    required: false
    default: "."
  out:
    description: "Output folder for the memo and JSON reports"
    required: false
    default: "testledger-out"
  mutation-report:
    description: "Optional PIT XML / Stryker JSON mutation report (AI-test governance)"
    required: false
    default: ""
  fail-on-quarantine:
    description: "Fail the job when any test is quarantine-grade (flake rate >= threshold)"
    required: false
    default: "false"
  comment-on-pr:
    description: "Post or update one summary comment on pull requests (needs pull-requests: write)"
    required: false
    default: "true"
  testledger-version:
    description: "Git ref of surkuar/testledger to install (tag, branch or SHA)"
    required: false
    default: "v0.1.0"
  github-token:
    description: "Token used to read workflow history and comment on PRs"
    required: false
    default: ${{ github.token }}

outputs:
  net-usd:
    description: "Net value (value delivered minus carrying cost) of the test estate in the window"
    value: ${{ steps.run.outputs.net-usd }}
  summary-path:
    description: "Path to summary.json"
    value: ${{ steps.run.outputs.summary-path }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install TestLedger
      shell: bash
      run: python -m pip install --quiet "git+https://github.com/surkuar/testledger.git@${{ inputs.testledger-version }}"
    - name: Analyse
      id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -e
        ARGS=(--reports "${{ inputs.reports }}" --out "${{ inputs.out }}")
        [ -f "${{ inputs.config }}" ] && ARGS+=(--config "${{ inputs.config }}")
        [ -n "${{ inputs.mutation-report }}" ] && ARGS+=(--mutation "${{ inputs.mutation-report }}")
        [ "${{ inputs.fail-on-quarantine }}" = "true" ] && ARGS+=(--fail-on-quarantine)
        testledger analyze "${ARGS[@]}" || code=$?
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os
        s = json.load(open(os.path.join("${{ inputs.out }}", "summary.json")))
        print(f"net-usd={s['net_usd']}")
        print("summary-path=${{ inputs.out }}/summary.json")
        PY
        testledger pr-comment "${{ inputs.out }}" > "${{ inputs.out }}/pr-comment.md"
        cat "${{ inputs.out }}/memo.md" >> "$GITHUB_STEP_SUMMARY"
        exit ${code:-0}
    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: testledger-reports
        path: ${{ inputs.out }}
    - name: Comment on PR
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('${{ inputs.out }}/pr-comment.md', 'utf8');
          const {data: comments} = await github.rest.issues.listComments({...context.repo, issue_number: context.issue.number});
          const mine = comments.find(c => c.body.startsWith('### 📒 TestLedger'));
          if (mine) await github.rest.issues.updateComment({...context.repo, comment_id: mine.id, body});
          else await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
